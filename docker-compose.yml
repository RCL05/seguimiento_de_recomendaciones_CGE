services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitra_cge}
      POSTGRES_USER: ${POSTGRES_USER:-sitra_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitra-dev-password-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-key-change-before-deployment-0123456789}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-compose-jwt-signing-key-change-before-deployment-0123456789}
      DJANGO_MEDIA_ROOT: /workspace/backend/media
      POSTGRES_DB: ${POSTGRES_DB:-sitra_cge}
      POSTGRES_USER: ${POSTGRES_USER:-sitra_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitra-dev-password-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SSO_INTROSPECTION_URL: ${SSO_INTROSPECTION_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-sitra-cge}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-31457280}
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/workspace/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_media:
  frontend_node_modules:
