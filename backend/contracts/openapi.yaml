openapi: 3.1.0
info:
  title: SITRA-CGE UNL API
  version: 1.0.0
  description: API del Sistema de Seguimiento de Recomendaciones de la Contraloría
    General del Estado (CGE) para la Universidad Nacional de Loja. Toda respuesta
    JSON usa la envoltura universal `success`, `message`, `data`, `errors`, `meta`.
paths:
  /api/v1/auditoria:
    get:
      operationId: consultarAuditoria
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar el historial inmutable de auditoría (UAI, auditor CGE, RF-018)
      parameters:
      - in: query
        name: entity
        schema:
          type: string
          minLength: 1
      - in: query
        name: entity_id
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
      tags:
      - Auditoría
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
  /api/v1/auth/login-sso:
    post:
      operationId: iniciarSesionSso
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Validar credencial institucional y emitir JWT
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginSsoRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginSsoRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginSsoRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
  /api/v1/evaluaciones-plazos:
    post:
      operationId: evaluarPlazos
      description: Normalmente lo invoca una tarea programada; es idempotente (RF-021).
      summary: 'Ejecutar la evaluación de plazos: alertas y vencimientos (DTI, RF-011,
        RF-012)'
      tags:
      - Notificaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionPlazosEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
  /api/v1/evidencias/{evidence_id}:
    patch:
      operationId: anularEvidencia
      description: 'Modificación parcial del estado: la evidencia y su historial se
        conservan (CA-07.3).'
      summary: Anular lógicamente una evidencia (UAI)
      parameters:
      - in: path
        name: evidence_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Evidencias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnulacionEvidenciaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnulacionEvidenciaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnulacionEvidenciaRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenciaAnuladaEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'CONFLICT / BUSINESS_RULE_VIOLATION: transición o regla de
            negocio incumplida.'
  /api/v1/evidencias/{evidence_id}/archivo:
    get:
      operationId: descargarEvidencia
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Abrir o descargar el PDF de una evidencia
      parameters:
      - in: query
        name: disposition
        schema:
          enum:
          - inline
          - attachment
          type: string
          default: inline
          minLength: 1
        description: |-
          * `inline` - inline
          * `attachment` - attachment
      - in: path
        name: evidence_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Evidencias
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: Contenido PDF.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
  /api/v1/evidencias/{evidence_id}/integridad:
    get:
      operationId: verificarIntegridadEvidencia
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Verificar el SHA-256 del archivo almacenado (UAI, auditor CGE)
      parameters:
      - in: path
        name: evidence_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Evidencias
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegridadEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
  /api/v1/informes:
    get:
      operationId: listarInformes
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar informes de examen especial (UAI, Rectorado, auditor CGE)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      tags:
      - Informes CGE
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformesEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
    post:
      operationId: registrarInforme
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Registrar un informe CGE con su documento oficial (UAI, RF-005)
      tags:
      - Informes CGE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InformeCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'CONFLICT / BUSINESS_RULE_VIOLATION: transición o regla de
            negocio incumplida.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PAYLOAD_TOO_LARGE: el PDF supera el tamaño máximo.'
  /api/v1/informes/{informe_id}:
    get:
      operationId: consultarInforme
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar un informe CGE
      parameters:
      - in: path
        name: informe_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Informes CGE
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeDetalleEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
  /api/v1/notificaciones:
    get:
      operationId: consultarBandeja
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar la bandeja de notificaciones del usuario autenticado
      tags:
      - Notificaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandejaEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
  /api/v1/notificaciones/configuracion:
    get:
      operationId: consultarConfiguracionNotificaciones
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar la configuración global de notificaciones
      tags:
      - Notificaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
    put:
      operationId: actualizarConfiguracionNotificaciones
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Actualizar la configuración global de notificaciones (DTI)
      tags:
      - Notificaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfiguracionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfiguracionUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionActualizadaEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
  /api/v1/notificaciones/preferencias:
    get:
      operationId: consultarPreferencias
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Consultar preferencias de notificación
      parameters:
      - in: query
        name: usuario_id
        schema:
          type: string
        description: Solo DTI puede consultar a otro usuario.
      tags:
      - Notificaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
    put:
      operationId: actualizarPreferencias
      description: 'Vista base: JWT Bearer obligatorio y 405 evaluado antes de autenticar.'
      summary: Reemplazar preferencias de notificación
      tags:
      - Notificaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreferenciasUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreferenciasUpdateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasActualizadasEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
  /api/v1/recomendaciones:
    get:
      operationId: listarRecomendaciones
      description: El ejecutor solo ve las recomendaciones de su unidad (RF-019).
      summary: Consultar recomendaciones visibles para el usuario (paginado y filtrable)
      parameters:
      - in: query
        name: due_after
        schema:
          type: string
          format: date
      - in: query
        name: due_before
        schema:
          type: string
          format: date
      - in: query
        name: due_date
        schema:
          type: string
          format: date
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: priority
        schema:
          enum:
          - ALTA
          - MEDIA
          - BAJA
          type: string
          minLength: 1
        description: |-
          * `ALTA` - ALTA
          * `MEDIA` - MEDIA
          * `BAJA` - BAJA
      - in: query
        name: state
        schema:
          enum:
          - PENDIENTE
          - EN_PROCESO
          - EN_VALIDACION
          - VENCIDA
          - REABIERTA
          - CUMPLIDA
          type: string
          minLength: 1
        description: |-
          * `PENDIENTE` - Pendiente
          * `EN_PROCESO` - En Proceso
          * `EN_VALIDACION` - En Validación
          * `VENCIDA` - Vencida
          * `REABIERTA` - Reabierta
          * `CUMPLIDA` - Cumplida
      - in: query
        name: unit_id
        schema:
          type: string
          minLength: 1
      tags:
      - Recomendaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacionesEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
    post:
      operationId: registrarRecomendacion
      description: La recomendación se crea en estado PENDIENTE.
      summary: Registrar y asignar una recomendación (UAI, RF-006)
      tags:
      - Recomendaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecomendacionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecomendacionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecomendacionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacionEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'VALIDATION_ERROR: campos, formatos o tipos inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'CONFLICT / BUSINESS_RULE_VIOLATION: transición o regla de
            negocio incumplida.'
  /api/v1/recomendaciones/{recommendation_id}:
    get:
      operationId: consultarRecomendacion
      description: Una recomendación de otra unidad responde 404 sin revelar su existencia
        (RF-019).
      summary: Consultar una recomendación con sus evidencias
      parameters:
      - in: path
        name: recommendation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Recomendaciones
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacionDetalleEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'AUTHENTICATION_REQUIRED: token Bearer ausente, inválido o
            expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'PERMISSION_DENIED: el rol no puede ejecutar la operación.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'RESOURCE_NOT_FOUND: inexistente o no visible para el usuario
            (BOLA/IDOR).'
  /api/v1/recomendaciones/{recommendation_id}/dictamenes:
    post:
      operationId: emitirDictamen
      description: Aprobado → CUMPLIDA (requiere revisión interna y PDF validado).
