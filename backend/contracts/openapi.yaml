components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        request_id:
          type: string
          format: uuid
        timestamp_utc:
          type: string
          format: date-time
        usuario:
          type:
          - string
          - 'null'
          format: email
        modulo:
          type: string
        accion:
          type: string
        entidad:
          type: string
        entidad_id:
          type:
          - string
          - 'null'
          format: uuid
        estado_anterior:
          type:
          - string
          - 'null'
        estado_nuevo:
          type:
          - string
          - 'null'
        resultado:
          type: string
        ip_origen:
          type:
          - string
          - 'null'
      required:
      - accion
      - entidad
      - entidad_id
      - estado_anterior
      - estado_nuevo
      - id
      - ip_origen
      - modulo
      - request_id
      - resultado
      - timestamp_utc
    AuditoriaEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        success:
          type: boolean
          default: true
        message:
          type: string
        errors:
          oneOf:
          - {}
          - type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - message
      - meta
    BandejaEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        success:
          type: boolean
          default: true
        message:
          type: string
        errors:
          oneOf:
          - {}
          - type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - message
      - meta
    CodeEnum:
      enum:
      - VALIDATION_ERROR
      - AUTHENTICATION_REQUIRED
      - PERMISSION_DENIED
      - RESOURCE_NOT_FOUND
      - METHOD_NOT_ALLOWED
      - BUSINESS_RULE_VIOLATION
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - INTERNAL_ERROR
      type: string
      description: |-
        * `VALIDATION_ERROR` - VALIDATION_ERROR
        * `AUTHENTICATION_REQUIRED` - AUTHENTICATION_REQUIRED
        * `PERMISSION_DENIED` - PERMISSION_DENIED
        * `RESOURCE_NOT_FOUND` - RESOURCE_NOT_FOUND
        * `METHOD_NOT_ALLOWED` - METHOD_NOT_ALLOWED
        * `BUSINESS_RULE_VIOLATION` - BUSINESS_RULE_VIOLATION
        * `CONFLICT` - CONFLICT
        * `PAYLOAD_TOO_LARGE` - PAYLOAD_TOO_LARGE
        * `UNSUPPORTED_MEDIA_TYPE` - UNSUPPORTED_MEDIA_TYPE
        * `INTERNAL_ERROR` - INTERNAL_ERROR
    Configuracion:
      type: object
      properties:
        umbral_dias:
          type: integer
        notificaciones_activas:
          type: boolean
        canal_interno_activo:
          type: boolean
        canal_email_activo:
          type: boolean
        destinatarios_vencimiento:
          type: array
          items:
            type: string
        destinatarios_mora:
          type: array
          items:
            type: string
        actualizado_en:
          type: string
          format: date-time
      required:
      - actualizado_en
      - canal_email_activo
      - canal_interno_activo
      - destinatarios_mora
      - destinatarios_vencimiento
      - notificaciones_activas
      - umbral_dias
